name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (SDK + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SDK must be built first so its dist/ is resolvable when the React
      # package typechecks (workspace symlinks point at packages/sdk/dist).
      - name: Build SDK
        run: pnpm --filter @proxies-sx/pool-sdk build

      - name: Typecheck packages
        run: pnpm -r --filter './packages/*' typecheck

      - name: Test packages
        run: pnpm -r --filter './packages/*' test

      - name: Build React package
        run: pnpm --filter @proxies-sx/pool-portal-react build

  starter:
    name: Starter (Next.js)
    runs-on: ubuntu-latest
    services:
      # Disposable database for the delivery journal test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (workspace deps)
        run: pnpm -r --filter './packages/*' build

      - name: Typecheck starter
        working-directory: apps/starter
        run: pnpm typecheck

      - name: Test starter
        working-directory: apps/starter
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
        run: pnpm test

      - name: Build starter
        working-directory: apps/starter
        env:
          # Placeholder env so next build can collect page data
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-32chars-aaaaaaaaaaaaaaaa
          AUTH_TRUST_HOST: 'true'
          PROXIES_SX_API_KEY: psx_ci_placeholder
          PROXIES_SX_USERNAME: psx_ci_placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
        run: pnpm build
